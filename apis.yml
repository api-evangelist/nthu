  name: NTHU Data API
  x-operator: tenant
  x-operator-detail: >-
    Built, hosted and maintained by the NTHU Student Association (NTHU-SA) at api.nthusa.tw, a
    domain the university does not own. The data is NTHU's campus data, scraped from NTHU unit

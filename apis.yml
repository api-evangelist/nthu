x-coverage:
  state: covered
  reason: covered
  detail: >-
    National Tsing Hua University operates exactly one API of its own and it was found, documented
    and probed: the Computer and Communication Center's OAuth 2.0 service at
    oauth.ccxp.nthu.edu.tw/v1.1, with a published interface manual, a governing regulation adopted
    2020-12-22 and a scheduled repeal of 2027-07-31. Everything else in this repo is now correctly
    attributed away from the institution. The nine OpenAPI documents previously listed as nine
    separate NTHU APIs are one contract, the NTHU Data API, and it is operated by the NTHU Student
    Association on nthusa.tw rather than by the university — recorded here as a single tenant
    surface rather than deleted, because the relationship is real. Two vendor platform tenancies
    were found and recorded without saving a vendor contract: an Ex Libris Esploro research portal
    on the NTHU-owned host scholars.nthu.edu.tw, and an Ex Libris Primo VE library discovery service
    on an Ex Libris host under the University System of Taiwan view 886UST_NTHU. Hunted and not
    found: no data./opendata./api. host under nthu.edu.tw resolves at all; NTHU has no eduGAIN entry
    and no Taiwanese registration authority appears in the eduGAIN entity list; the OAI-PMH service
    exists but returns 403; the Esploro portal answers every path with the same 2,328-byte SPA
    shell. Searched in Traditional Chinese as well as English, which is how the OAuth governance
    regulation and both AI-policy documents were found.

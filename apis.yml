description: >-
  National Tsing Hua University (NTHU) is a national public research university in Hsinchu, Taiwan,
  founded in Beijing in 1911 and re-established in Taiwan in 1956. It has no central developer
  portal, no API catalog and no institution-wide API program, and this profile is deliberately small
  because the honest footprint is small. It does, however, hold something most of this cohort does
  not: one genuinely institution-operated, institution-governed API. NTHU's Computer and
  Communication Center runs an OAuth 2.0 authorization and identity service at
  oauth.ccxp.nthu.edu.tw, fronting the Academic Information System (CCXP), documented by the
  university in its own interface manual, governed by a regulation passed by the Computer and
  Communication Committee in December 2020, and carrying a published scheduled repeal date of
  2027-07-31. It is not self-service — a request needs a unit head's signature, Computer and
  Communication Center review, and sign-off from every unit that owns a requested data field — but
  it is NTHU's own engineering on NTHU's own host. Everything else programmable that carries NTHU's
  name is operated by someone else. The widely cited NTHU Data API, a live FastAPI service with an
  OpenAPI 3.1.0 description and 22 keyless public paths over campus announcements, buses, courses,
  departments, dining, energy, library spaces, locations and newsletters, is built and hosted by the
  NTHU Student Association on nthusa.tw, not by the university on nthu.edu.tw. The research portal
  at scholars.nthu.edu.tw is an Ex Libris Esploro tenant, and the library discovery service is an
  Ex Libris Primo VE tenant shared through the University System of Taiwan consortium. Those are
  real institutional facts and they are recorded as tenant relationships, but they are not NTHU's
  contracts and are not scored as such.

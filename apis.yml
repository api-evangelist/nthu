- aid: nthu:nthu-oauth-api
  name: NTHU Academic Information System OAuth 2.0 Service
  x-operator: institution
  description: >-
    The one API National Tsing Hua University operates itself. An OAuth 2.0 authorization-code
    service run by the Computer and Communication Center on NTHU's own host, letting a reviewed
    external application authenticate an NTHU faculty, staff or student account against the Academic
    Information System (CCXP) and read an approved subset of six identity fields — userid, name,
    email, inschool, cid and lmsid. NTHU publishes the interface manual itself; the OpenAPI here is
    derived from that manual, not fabricated, and all three endpoints were probed live on
    2026-08-30. Access is application-gated: a unit head must sign, the Computer and Communication
    Center must review, and each data-owning unit must approve the fields released. Secret keys
    expire after one year.
